    fade($('names'), seg(t, T.cierre + 0.3, T.cierre + 0.9), 20);
    fade($('cta'), seg(t, T.agenda - 0.2, T.agenda + 0.4), 40);
  }
  renderer.render(scene, camera);
}
window.TOTAL_FRAMES = Math.round(DURATION*FPS);
window.DBG = () => ({v: M.screw.visible, p: M.screw.position.toArray(), s: M.screw.scale.toArray(), parent: !!M.screw.parent, geo: M.screw.geometry.attributes.position.count, bb: (M.screw.geometry.computeBoundingBox(), M.screw.geometry.boundingBox)});
window.renderFrame = f => { frame(f); return true; };
window.GPU = (() => { try { const g = renderer.getContext(); const e = g.getExtension('WEBGL_debug_renderer_info'); return e ? g.getParameter(e.UNMASKED_RENDERER_WEBGL) : g.getParameter(g.RENDERER); } catch (e) { return ''; } })();
build();
Promise.all([document.fonts.ready, new Promise(r => { const i = $('logo'); i.complete ? r() : (i.onload = r, i.onerror = r); })]).then(() => { window.READY = true; });
</script></body></html>
