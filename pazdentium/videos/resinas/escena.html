function inset(poly, dfn) {

function clipBelow(poly, level) {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i+1)%poly.length];
    const ina = a[1] <= level, inb = b[1] <= level;

    if (ina !== inb) { const k = (level - a[1]) / (b[1] - a[1]); out.push([a[0] + (b[0]-a[0])*k, level]); }

}

        float a = float(i)*0.785398;
        vec2 o = vec2(cos(a),sin(a))*px;
        vec3 c = texture2D(tId,vUv+o).rgb; float d = lin(texture2D(tDepth,vUv+o).r);
        e = max(e, step(0.02, distance(c,c0)));
        e = max(e, step(0.06*min(d,d0), abs(d-d0)));
      }
      vec3 col = texture2D(tBeauty,vUv).rgb;
      gl_FragColor = vec4(mix(col, ink, e*0.92), 1.);
      #include <colorspace_fragment>
    }`
}));
const postScene = new THREE.Scene(); postScene.add(post);
const postCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const idMats = new Map();
function idMat(mat) {
  if (!idMats.has(mat)) idMats.set(mat, new THREE.MeshBasicMaterial({color: idColorFor(mat.userData.id || 99)}));
  return idMats.get(mat);
}
const resinIdOverride = {active:false};
function renderAll() {
  renderer.setRenderTarget(rtBeauty); renderer.render(scene, camera);
  // pasada de ID
  const saved = [];
  scene.background = new THREE.Color(0,0,0);
  scene.traverse(o => {
    if (!o.isMesh) return;
    saved.push([o, o.material, o.visible]);
    if (o.material.userData.noOutline || o === shadowPlane) { o.visible = false; return; }
    let m = o.material;
    if (m === mResin && resinIdOverride.active) m = mEnamel;
    o.material = idMat(m);
  });
  renderer.setRenderTarget(rtId); renderer.render(scene, camera);
  for (const [o, m, v] of saved) { o.material = m; o.visible = v; }
  scene.background = BG;
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}

// ---------------------------------------------------------------- cámara
const CAM = [ // t, pos, target
  [0.0,  [1.8, 3.6, 5.6],  [0, 0.35, 0]],
  [3.3,  [1.3, 3.3, 5.4],  [0, 0.4, 0]],
  [5.2,  [0.6, -0.3, 7.6], [0, -0.9, 0]],
  [7.4,  [0.4, -0.2, 7.3], [0, -0.8, 0]],
  [10.8, [0.4, 0.6, 5.6],  [0, 0.35, 0]],
  [15.0, [-0.5, 0.8, 5.3], [0, 0.4, 0]],
  [18.6, [0.3, 0.7, 5.0],  [0, 0.45, 0]],
  [23.6, [0.6, 0.9, 5.2],  [0, 0.45, 0]],
  [29.6, [0.0, 1.0, 5.8],  [0, 0.6, 0]],
  [34.0, [-0.5, 0.9, 5.4], [0, 0.4, 0]],
  [38.0, [0.3, 0.0, 7.0],  [0, -0.6, 0]],
  [42.0, [0.0, 0.1, 7.6],  [0, -0.6, 0]],
  [47.0, [0.0, 0.1, 7.8],  [0, -0.6, 0]],
];
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
function cameraAt(t) {
  let i = 0; while (i < CAM.length - 2 && t > CAM[i+1][0]) i++;
  const [t0, p0, g0] = CAM[i], [t1, p1, g1] = CAM[i+1];
  const k = eio(seg(t, t0, t1));
  camera.position.set(lerp(p0[0],p1[0],k) + 0.06*Math.sin(t*0.7), lerp(p0[1],p1[1],k) + 0.04*Math.sin(t*0.53), lerp(p0[2],p1[2],k));
  tmpA.set(lerp(g0[0],g1[0],k), lerp(g0[1],g1[1],k), lerp(g0[2],g1[2],k));
  camera.lookAt(tmpA);
}

// ---------------------------------------------------------------- subtítulos y rótulos (DOM)
const capEl = document.getElementById('caption'), lblEl = document.getElementById('labels');
function captionAt(t) {
  const c = CAPTIONS.find(c => t >= c[0] && t < c[1]);
  if (!c) { capEl.innerHTML = ''; return; }
  const words = c[2].split(' '); const step = Math.min(0.28, (c[1]-c[0]) * 0.75 / words.length);
  capEl.innerHTML = words.map((w, i) => {
    const k = eout(seg(t, c[0] + i*step, c[0] + i*step + 0.12));
    const hi = c[3].includes(i);
    const col = hi ? (c[4] === 'blue' ? '#2f6df6' : COL.teal) : COL.ink;
    return `<span style="opacity:${k};transform:translateY(${(1-k)*26}px) scale(${0.92+0.08*k});color:${col}">${w}</span>`;
  }).join('');
}
const v3 = new THREE.Vector3();
function labelsAt(t) {
  let html = '';
  for (const [a, b, txt, x, y, z] of LABELS) {
    const o = vis(t, a, b, .2); if (o <= 0) continue;
    v3.set(x, y, z); tooth.localToWorld(v3); v3.project(camera);
    const sx = (v3.x*.5+.5)*1080, sy = (-v3.y*.5+.5)*1920;
    html += `<div class="lbl" style="left:${sx}px;top:${sy}px;opacity:${o};transform:translate(-50%,-50%) translateY(${(1-o)*14}px)"><i></i>${txt}</div>`;
  }
  lblEl.innerHTML = html;
}

// ---------------------------------------------------------------- línea de tiempo
const cEnamel0 = new THREE.Color(COL.enamel), cEnamelDull = new THREE.Color('#efe6d2');
const cResin0 = new THREE.Color(COL.resin);
function frame(f) {
  const t = f / FPS;
  cameraAt(t);

  // giro del diente (S10): gira hacia un lado y vuelve, terminando de frente (sin vuelta de 360°)
  { const k = eio(seg(t, 38.2, 41.4)), settle = seg(t, 38.2, 41.4);   // media vuelta (180°) y queda mostrando la cara del corte
    tooth.rotation.y = (-0.16 + 0.05*Math.sin(t*0.4))*(1 - settle) + Math.PI*k + 0.015*Math.sin(t*0.8)*settle; }
  tooth.position.y = 0;

  // S1: blanqueamiento — el esmalte se aclara, la mancha no
  const sweep = seg(t, 1.2, 3.2);
  whiteSweep.visible = sweep > 0 && sweep < 1;
  whiteSweep.position.set(lerp(-1.8, 1.8, eio(sweep)), 1.1, DEPTH/2);
  mEnamel.color.copy(cEnamelDull).lerp(cEnamel0, eio(seg(t, 1.4, 3.3)));
  topSpot.visible = t < 5.0;
  topSpot.scale.set(1 + 0.15*seg(t,3.6,7), 1.6 + 0.2*seg(t,3.6,7), 1);

  // caries: crece (S2), avanza bajo el parche (S3), se rebobina y se retira (S4)
  let s = lerp(0.75, 1.0, eio(seg(t, 3.8, 7.0)));
  s = lerp(s, 2.0, eio(seg(t, 8.0, 10.3)));
  s = lerp(s, 1.0, eio(seg(t, 10.45, 10.95)));               // rebobinado
  const removal = eio(seg(t, 12.0, 14.4));
  const cariesShown = removal < 0.999;
  const cp = cariesShown ? cariesPoly(s, t*2.0).map(([x, y]) => {
    // se "come" de arriba hacia abajo mientras la fresa trabaja
    const cut = lerp(1.25, 0.6, removal); return [x * (1 - 0.15*removal), Math.min(y, cut)];
  }) : null;
  cariesMesh = setDyn(cariesMesh, cariesShown && removal < 0.98 ? cp : null, mCaries, 0.004);

  // pulpa se inflama cuando la caries avanza
  const inflame = seg(t, 9.2, 10.2) * (1 - seg(t, 10.45, 10.95));
  mPulp.color.set(COL.pulp).lerp(new THREE.Color('#e3262f'), inflame * (0.6 + 0.4*Math.sin(t*14)));

  // parche gris (S3)
  const capK = vis(t, 7.6, 10.6, .35);
  capMesh = setDyn(capMesh, capK > 0 ? smoothClosed([[-0.55,1.1],[-0.3,1.2],[0,1.22],[0.3,1.2],[0.55,1.1],[0.4,1.02],[0,1.0],[-0.4,1.02]], 60)
    .map(([x,y]) => [x, y + (1-eback(capK))*1.2]) : null, mCap, 0.006, 0.4);
  if (capMesh) capMesh.position.z = FRONT - 0.4 + 0.006 + 0.0;

  // cavidad limpia
  const cavK = seg(t, 12.2, 13.8);
  cavityMesh = setDyn(cavityMesh, cavK > 0 ? CAVITY : null, mCavity, 0.003);
  if (cavityMesh) cavityMesh.scale.setScalar(1);
  mCavity.opacity = 1;

  // fresa (S4)
  const burIn = eio(seg(t, 11.2, 12.0)), burOut = eio(seg(t, 14.3, 15.0));
  bur.visible = burIn > 0 && burOut < 1;
  const jig = 0.03*Math.sin(t*60);
  bur.position.set(lerp(2.4, 0.08 + jig, burIn) + burOut*2.6, lerp(4.0, 0.98 - 0.25*removal, burIn) + burOut*3.0, 0.5);
  bur.rotation.z = -0.35; bur.rotation.y = t*40;
  dust.forEach((d, i) => {
    const life = (t*1.7 + i*0.137) % 1; const on = t > 12.0 && t < 14.4;
    d.visible = on;
    const a = i*2.39; d.position.set(Math.cos(a)*(0.2+life*0.9), 1.15 + life*0.8 - life*life*1.2, 0.5 + Math.sin(a)*0.3);
    d.scale.setScalar(1 - life);
  });

  // S5: la resina rebota y se sale
  const rb = seg(t, 15.4, 18.2);
  resinBlob.visible = rb > 0 && rb < 1;
  if (resinBlob.visible) {
    const a = seg(rb, 0, 0.35), b = seg(rb, 0.35, 1);
    const y = rb < 0.35 ? lerp(3.2, 1.0, a*a) : 1.0 + 1.9*b - 3.6*b*b;
    resinBlob.position.set(rb < 0.35 ? 0 : 2.6*b, y, 0.5);
    const sq = rb > 0.33 && rb < 0.4 ? 0.7 : 1; resinBlob.scale.set(1/Math.sqrt(sq), sq, 1/Math.sqrt(sq));
    resinBlob.rotation.z = -b*5;
  }

  // S6: gel grabador (sube como nivel, luego se enjuaga) + adhesivo
  const gelUp = seg(t, 19.0, 20.4), gelOut = seg(t, 21.0, 21.6);
  const gelLevel = lerp(0.68, 1.25, eio(gelUp));
  mGel.opacity = 0.85 * (1 - gelOut);
  gelMesh = setDyn(gelMesh, gelUp > 0 && gelOut < 1 ? clipBelow(CAVITY, gelLevel) : null, mGel, 0.007);
  const adhK = seg(t, 21.6, 22.6);
  const adhOn = adhK > 0 && t < 28.9;
  adhMesh = setDyn(adhMesh, adhOn ? CAVITY : null, mAdh, 0.008);
  const th = 0.05 * eout(adhK);
  innerCavMesh = setDyn(innerCavMesh, adhOn ? CAVITY.map(([x, y]) => [x * (1 - th/0.43), y < 1.0 ? y + th : y + 0.02]) : null, mCavity, 0.009);
  mAdh.emissiveIntensity = 0.3 + 0.5*pulse(t, 22.0, 23.2);

  // S7: resina por capas + fotocurado
  const layers = [[24.4, 25.3, 0.86], [26.0, 26.9, 0.99], [27.6, 28.5, 1.16]];
  let level = 0.6;
  for (const [a, b, l] of layers) level = lerp(level, l, eio(seg(t, a, b)));
  const resinOn = t > 24.4;
  resinMesh = setDyn(resinMesh, resinOn ? clipBelow(CAVITY, level) : null, mResin, 0.012);
  const cures = [[25.3, 25.95], [26.9, 27.55], [28.5, 29.2]];
  let flash = 0; for (const [a, b] of cures) flash = Math.max(flash, pulse(t, a, b));
  const wandIn = eio(seg(t, 24.9, 25.4)), wandOut = eio(seg(t, 29.2, 29.8));
  wand.visible = wandIn > 0 && wandOut < 1;
  // apuntar el haz al centro de la resina (punto en el espacio del diente → mundo)
  tooth.updateMatrixWorld(true);
  const aim = new THREE.Vector3(0, Math.min(level, 1.05) - 0.08, FRONT + 0.05);
  inner.localToWorld(aim);
  const wth = -0.42, reach = 1.25;                       // inclinación: mango arriba a la derecha
  wand.rotation.z = wth;
  const bx = aim.x - reach*Math.sin(wth), by = aim.y + reach*Math.cos(wth);
  const away = (1 - wandIn) * 2.6 + wandOut * 3.2;      // entra y sale en diagonal
  wand.position.set(bx + away*0.75, by + away, aim.z);
  cone.visible = flash > 0.02; mCone.opacity = 0.45 * flash;
  document.getElementById('flash').style.opacity = 0.18 * flash;

  // S8: color igual al diente
  const match = eio(seg(t, 31.0, 33.2));
  mResin.color.copy(cResin0).lerp(cEnamel0, match);
  mResin.emissive = mResin.emissive || new THREE.Color(); mResin.emissive.set('#3d7bff'); mResin.emissiveIntensity = 0.35*flash;
  resinIdOverride.active = match > 0.85;
  const shK = vis(t, 29.8, 33.6, .4);
  shades.forEach((g, i) => {
    g.visible = shK > 0;
    const k = eback(clamp01(shK*1.4 - i*0.15));
    g.position.set((i - 1)*0.62, lerp(3.6, 2.15, k), 0.6); g.rotation.z = (i-1)*-0.08; g.scale.setScalar(Math.max(0.001, k));
  });
  const selK = eback(seg(t, 31.0, 31.5)) * (1 - seg(t, 33.2, 33.6));
  selRing.visible = selK > 0.01; selRing.position.set(0, 2.2, 0.6); selRing.scale.setScalar(Math.max(0.001, selK));

  // S9: forma + pulido + brillo
  const polIn = eio(seg(t, 34.3, 34.9)), polOut = eio(seg(t, 36.4, 37.0));
  cup.visible = polIn > 0 && polOut < 1;
  cup.position.set(lerp(2.6, 0.15*Math.sin(t*9), polIn) + polOut*2.6, lerp(4, 1.32, polIn) + polOut*3, 0.5);
  cup.rotation.z = -0.25; cup.rotation.y = t*35;
  sparkles.forEach(sp => {
    const k = pulse(t, 36.2 + sp.userData.d, 37.6 + sp.userData.d) + pulse(t, 39.5 + sp.userData.d, 41.2 + sp.userData.d)*0.8;
    sp.visible = k > 0.01; sp.scale.setScalar(Math.max(0.001, k*1.5)); sp.rotation.z = t*1.5;
    sp.lookAt(camera.position);
  });
  if (resinMesh) resinMesh.visible = true;
  if (cavityMesh) cavityMesh.visible = !(t > 33.4);

  // bacterias (S2)
  bacteria.forEach((b, i) => {
    const k = vis(t, 3.7 + i*0.08, 7.3, .3);
    b.visible = k > 0.01;
    const a = i*0.7 + t*(0.8 + (i%3)*0.3);
    const r = lerp(0.9, 0.35, seg(t, 4.0, 7.0)) + 0.08*Math.sin(t*3 + i);
    b.position.set(Math.cos(a)*r*0.9, 1.25 + Math.sin(a*1.3)*0.18 + 0.15*(i%2), FRONT + 0.06);
    b.rotation.z = a*2; b.scale.setScalar(Math.max(0.001, k));
  });

  // CTA
  const ctaK = seg(t, 42.0, 42.6);
  const ctaEl = document.getElementById('cta');
  ctaEl.style.opacity = eio(ctaK);
  const q = eback(seg(t, 42.4, 43.0)), cd = eback(seg(t, 43.0, 43.7)), ss = seg(t, 43.8, 44.3);
  document.getElementById('ctaq').style.transform = `translateY(${(1-q)*60}px)`; document.getElementById('ctaq').style.opacity = clamp01(q);
  document.getElementById('ctacard').style.transform = `scale(${Math.max(0.01, cd)}) rotate(${(1-clamp01(cd))*-6}deg)`;
  document.getElementById('ctas').style.opacity = ss;

  captionAt(t);
  labelsAt(t);
  renderAll();
}
window.TOTAL_FRAMES = Math.round(DURATION * FPS);
window.renderFrame = f => { frame(f); return true; };
window.GPU = (() => { try { const g = document.createElement('canvas').getContext('webgl2'); const e = g.getExtension('WEBGL_debug_renderer_info'); return e ? g.getParameter(e.UNMASKED_RENDERER_WEBGL) : g.getParameter(g.RENDERER); } catch (e) { return 'desconocido'; } })();
document.fonts.ready.then(() => { window.READY = true; });
</script>
</body>
