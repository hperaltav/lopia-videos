  const pts = []; for (let i = 0; i <= 40; i++) { const u = i/40; pts.push([60 + u*360, 230 - Math.sin(u*Math.PI)*150 + u*20]); }
  const n = Math.floor(k*40); ctx.beginPath(); pts.slice(0, n + 1).forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
  if (k > 0.95) { ctx.beginPath(); ctx.moveTo(420, 250); ctx.lineTo(450, 175); ctx.moveTo(420, 250); ctx.lineTo(345, 230); ctx.stroke(); }
}

// ============================================================ línea de tiempo
const hide = P => { P.root.visible = false; };
// "golpe" al pegar: llega grande, se aplasta y rebota (estirar y encoger)
const slap = (t, t0, d = 0.35) => { const k = seg(t, t0, t0 + d); if (k <= 0) return null;
  const s = k < 0.45 ? lerp(1.9, 0.86, eio(k/0.45)) : lerp(0.86, 1, elastic((k - 0.45)/0.55)); return {s, sq: k < 0.45 ? 1 : 1 + 0.12*Math.sin((k - 0.45)*18)*(1 - k)}; };
function frame(f) {
  const t = f/FPS, tq = Math.floor(t*STOP)/STOP;          // tiempo cuantizado: animación a 12 cuadros/s
  grainEl.style.backgroundImage = grains[Math.floor(t*STOP) % grains.length];

  // 1) diario: llega hecho bola, se abre; luego se arruga y sale volando
  { const inK = eout(seg(tq, 0, 0.5)), open = eio(seg(tq, 0.45, 1.25)), close = eio(seg(tq, 2.95, 3.35)), away = seg(tq, 3.35, 3.85);
    news.root.visible = tq < 3.85; news.set(Math.max(1 - open, close), 0.07);
    place(news, tq, lerp(1.2, 0, inK) + away*away*3.5, lerp(3.6, 0.1, inK) + away*1.5, lerp(-1.2, -0.06, inK) + away*2.5, 1, 1, 1); }
  letters.forEach((P, i) => { const sl = slap(tq, 1.3 + i*0.11); P.root.visible = !!sl && tq < 3.05;
    if (!sl) return; const x = (i - (HEAD.length - 1)/2)*0.29, y = 0.55 + (hash(i, 5) - 0.5)*0.16;
    place(P, tq, x, y, (hash(i, 6) - 0.5)*0.35, sl.s, sl.s*sl.sq, 30 + i); P.set(seg(tq, 2.9, 3.05)); });

  // 2) recorte del diente (se estira al pegarse) + cintas + globo + flecha
  { const sl = slap(tq, 3.55, 0.45), out = seg(tq, 6.75, 7.15); toothP.root.visible = !!sl && tq < 7.15;
    if (sl) { const st = 1 + 0.18*Math.sin(tq*4)*seg(tq, 4.0, 4.4)*(1 - seg(tq, 5.4, 5.8));       // estirón elástico
      place(toothP, tq, -0.12 - out*out*4, 0.62 + out*0.5, -0.08 - out*1.5, sl.s/st*0.98, sl.s*sl.sq*st, 40); toothP.set(out*1.2, 0.05); } }
  [[-1.05, 1.82, 0.7], [0.8, 1.82, -0.6]].forEach(([x, y, r], i) => { const P = tapes[i], on = tq > 4.05 + i*0.15 && tq < 6.75;
    P.root.visible = on; if (on) place(P, tq, x, y, r, 1, 1, 50 + i, 0.02); });
  { const sl = slap(tq, 4.6, 0.4), out = seg(tq, 6.6, 6.95); bub.root.visible = !!sl && tq < 6.95;
    if (sl) { place(bub, tq, 0.15 + out*3, -1.62, 0.06, sl.s, sl.s*sl.sq, 60); bub.set(out); } }
  { const k = seg(tq, 5.2, 5.75); arrowP.visible = k > 0 && tq < 6.7; drawArrow(k); arrowTex.needsUpdate = true;
    const [bx, by] = boil(tq, 70); arrowP.position.set(0.95 + bx, -0.72 + by, 0.2); arrowP.rotation.z = 1.75; }

  // 3) tres tarjetas: cada diente lleva su bracket
  cards.forEach((P, i) => { const sl = slap(tq, 7.0 + i*0.6, 0.38), out = seg(tq, 10.0 + i*0.08, 10.4 + i*0.08);
    P.root.visible = !!sl && out < 1; if (!sl) return;
    const pos = [[-0.55, 1.2, -0.12], [0.55, 0.05, 0.1], [-0.45, -1.15, -0.06]][i];
    place(P, tq, pos[0] + out*out*(i % 2 ? 4 : -4), pos[1], pos[2] + out*2*(i % 2 ? 1 : -1), sl.s, sl.s*sl.sq, 80 + i); P.set(out*0.9, 0.05); });
  [[-1.1, 1.85, 0.5], [1.05, 0.62, -0.45], [-0.95, -0.6, 0.35]].forEach(([x, y, r], i) => { const P = tapes[2 + i], on = tq > 7.25 + i*0.6 && tq < 10.0;
    P.root.visible = on; if (on) place(P, tq, x, y, r, 0.8, 0.8, 90 + i, 0.03); });
  hide(tapes[5]);

  // 4) cierre: cartel con logo + letras recortadas
  { const sl = slap(tq, 10.35, 0.45); ban.root.visible = !!sl; if (sl) { place(ban, tq, 0, 0.95, -0.04, sl.s, sl.s*sl.sq, 100); ban.set(0, 0.05); } }
  cta.forEach(({P, i}) => { const sl = slap(tq, 10.85 + i*0.05, 0.3); P.root.visible = !!sl; if (!sl) return;
    const word = i < 6 ? 0 : i < 9 ? 1 : 2, starts = [0, 7, 10], idx = i - starts[word], len = [6, 2, 10][word];
    const x = (idx - (len - 1)/2)*0.285, y = [-0.5, -0.95, -1.42][word] + (hash(i, 5) - 0.5)*0.06;
    place(P, tq, x, y, (hash(i, 6) - 0.5)*0.3, sl.s, sl.s*sl.sq, 110 + i); });

  renderer.render(scene, camera);
}
window.TOTAL_FRAMES = Math.round(DURATION*FPS);
window.renderFrame = f => { frame(f); return true; };
window.GPU = (() => { try { const g = document.createElement('canvas').getContext('webgl2'); const e = g.getExtension('WEBGL_debug_renderer_info'); return e ? g.getParameter(e.UNMASKED_RENDERER_WEBGL) : g.getParameter(g.RENDERER); } catch (e) { return 'desconocido'; } })();
build().then(() => { window.READY = true; });
</script></body></html>
