<script type="module">
const THREE = window.THREE;
const FPS = 30, DURATION = 15.0, STOP = 12;
const SC = Number(new URLSearchParams(location.search).get('scale') || 1);
const W = Math.round(1080*SC), H = Math.round(1920*SC);
if (SC !== 1) { const st = document.getElementById('stage'); st.style.transform = `scale(${SC})`; st.style.transformOrigin = '0 0'; }
const clamp01 = x => Math.max(0, Math.min(1, x)), seg = (t, a, b) => clamp01((t - a)/(b - a)), lerp = (a, b, k) => a + (b - a)*k;
const eio = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2, eout = x => 1 - Math.pow(1 - x, 3);
const eback = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(x - 1, 3) + c1*Math.pow(x - 1, 2); };
const hash = (a, b = 0) => { const s = Math.sin(a*127.1 + b*311.7)*43758.5453; return s - Math.floor(s); };

// ============================================================ escena tipo "foto de juguetes"
const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true});
renderer.setSize(W, H, false); renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#e9dcc8');
const camera = new THREE.PerspectiveCamera(32, 1080/1920, 0.1, 60);
scene.add(new THREE.HemisphereLight('#fff4e6', '#8a6d52', 0.75));
const key = new THREE.DirectionalLight('#fff1dc', 3.0); key.position.set(-4, 6, 8); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, {left: -5, right: 5, top: 7, bottom: -7, near: 1, far: 30}); key.shadow.radius = 8; key.shadow.bias = -0.0006; scene.add(key);
const rim = new THREE.DirectionalLight('#ffd9e6', 1.0); rim.position.set(5, 2, -3); scene.add(rim);

// ============================================================ fieltro: textura de fibras + brillo de tela + pelusa en capas

<script>
/* Lopia Studio: reproducción en vivo dentro del Studio (solo con ?studio) */
(()=>{const q=new URLSearchParams(location.search);if(!q.has('studio'))return;
let playing=true,t0=performance.now(),off=0,last=-1,sent=false;const fps=+(q.get('fps')||15),step=Math.max(1,Math.round(30/fps));
const total=()=>window.TOTAL_FRAMES||450,cur=()=>playing?off+(performance.now()-t0)/1000:off;
function loop(){if(window.READY){if(!sent){sent=true;parent.postMessage({studio:1,ready:1},'*');}

 const dur=total()/30;let t=cur();if(t>=dur){off=0;t0=performance.now();t=0;}
 const f=Math.min(total()-1,Math.floor(t*30/step)*step);if(f!==last){last=f;try{window.renderFrame(f);}catch(e){console.error(e);}}
 parent.postMessage({studio:1,t,dur,playing},'*');}requestAnimationFrame(loop);}
addEventListener('message',e=>{const d=e.data||{};
 if(d.cmd==='play'&&!playing){t0=performance.now();playing=true;}
 if(d.cmd==='pause'&&playing){off=cur();playing=false;}
 if(d.cmd==='seek'){off=Math.max(0,d.t);t0=performance.now();last=-1;}});
requestAnimationFrame(loop);})();
</script>
