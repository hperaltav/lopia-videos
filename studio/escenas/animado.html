    u.head.rotation.z = -0.08*w;
    const hnd = new THREE.Vector3(-1.2, -0.25 + 0.05*Math.sin(t*3), 0.75); u.arms.R.set(new THREE.Vector3(-1.62, -1.15, 0.3), hnd);
    u.arms.L.set(new THREE.Vector3(1.15, -1.7, 0.15), new THREE.Vector3(1.1, -2.4, 0.35));
    dTool.position.set(hnd.x, hnd.y + 0.84, hnd.z); dTool.rotation.set(0, 0, Math.PI + 0.12);
    v3.set(0.33, 0.12, 0.9); u.head.localToWorld(v3); winkStar.position.copy(v3).add(new THREE.Vector3(0.28, 0.25, 0.3));
    const sk = pulse(t, 46.45, 47.4); winkStar.visible = sk > 0.02; winkStar.scale.setScalar(Math.max(.01, 1.6*sk)); winkStar.rotation.z = t*3; winkStar.lookAt(camera.position);
    const ck = pulse(t, 46.45, 47.6); const ch = $('ching'); ch.style.opacity = ck; ch.style.left = '770px'; ch.style.top = '520px';
    ch.style.transform = `translate(-50%,-50%) rotate(-10deg) scale(${0.6 + 0.6*eback(clamp01(seg(t, 46.45, 46.8)))})`;
  } else { winkStar.visible = false; $('ching').style.opacity = 0; }
  // instrumento: retira el sarro (l13)
  scaler.visible = inW(t, 47.95, 51.6);
  if (scaler.visible) { const p = seg(t, 48.3, 51.0); const idx = Math.min(5, Math.floor(p*6)); const tt = teeth[idx];
    const sub = inW(t, 49.6, 51.0); scaler.rotation.set(0, 0, 0.5);
    scaler.position.set(tt.cx + 0.05*Math.sin(t*18), (sub ? 0.32 : 0.12) + 0.05*Math.cos(t*18), 0.5 - 0.55*Math.pow(tt.cx/1.6,2)); }
  flakes.forEach((fl, i) => { const life = (t*1.5 + i*0.1) % 1; fl.visible = inW(t, 48.4, 51.0);
    const tt = teeth[Math.min(5, Math.floor(seg(t, 48.3, 51.0)*6))]; fl.position.set(tt.cx + Math.cos(i*2.4)*life*0.8, 0.1 + life*0.7 - life*life*1.4, 0.6 + Math.sin(i)*0.3); fl.scale.setScalar(1 - life); });
  // pulido (l14 inicio)
  cup.visible = inW(t, 51.9, 54.4);
  if (cup.visible) { const p = seg(t, 52.2, 54.1); const tt = teeth[Math.min(5, Math.floor(p*6))]; cup.scale.setScalar(0.6); cup.rotation.set(0.5, 0, -0.6);
    cup.position.set(tt.cx + 0.06*Math.sin(t*10), -0.12 + 0.04*Math.cos(t*10), 0.5 - 0.55*Math.pow(tt.cx/1.6,2)); }
  // lupa: encuentra la caries pequeña (l14–l15)
  lens.visible = inW(t, 54.3, 59.8);
  if (lens.visible) { const k = eio(seg(t, 54.3, 55.0)); const tt = teeth[3]; const sx = lerp(-1.4, tt.cx + 0.06, k) + 0.04*Math.sin(t*2);
    lens.position.set(sx, -0.24, 0.85); lens.scale.setScalar(1 + 0.15*pulse(t, 55.0, 55.6)); }
  ring.visible = inW(t, 55.0, 59.8); ring.position.set(teeth[3].cx + 0.06, -0.24, 0.48); ring.scale.setScalar(Math.max(.01, eback(seg(t, 55.0, 55.4))));
  smallCaries.scale.setScalar(t > 57.3 ? Math.max(0.01, 1 - seg(t, 57.3, 58.2)) : 1);
  // calendario cada 6 meses (l16)
  const calK = vis(t, 60.0, 64.2, .35); pop($('calendar'), calK);
  [[2, 61.0], [8, 62.0]].forEach(([mi, a]) => { const el = $('mo' + mi); const k = seg(t, a, a + 0.35);
    el.querySelector('em').style.opacity = k; el.querySelector('b').style.opacity = k; el.style.background = k > 0.5 ? '#d6f0ec' : '#f5efe3'; });
  // brillo final
  sparkles.forEach((sp, i) => { const k = pulse(t, 53.6 + i*0.12, 55.2 + i*0.12) + pulse(t, 60.2 + i*0.15, 63.8 + i*0.15)*0.9;
    sp.visible = k > 0.01 && row.visible; sp.scale.setScalar(Math.max(.01, k*1.4)); sp.rotation.z = t*1.4; });
  // caries por ácido en el corte (l5)
  if (sSlice) {
    const s = lerp(0.25, 1.7, eio(seg(t, 15.8, 18.8)));
    if (cariesMesh) { sIn.remove(cariesMesh); cariesMesh.geometry.dispose(); }
    cariesMesh = new THREE.Mesh(extrude(cariesPoly(s, t*2), 0.01), mCar); cariesMesh.position.z = SD + 0.004; sIn.add(cariesMesh);
    acid.forEach((a, i) => { const life = (t*0.9 + i*0.125) % 1; a.visible = true; a.position.set(-0.25 + (i%4)*0.17, 2.3 - life*1.25, 0.5); a.scale.set(1, 1.3, 1).multiplyScalar(1 - 0.6*life); });
    slice.rotation.y = -0.16 + 0.05*Math.sin(t*0.4);
  }
  // CTA
  const ck = seg(t, 64.3, 64.9); $('cta').style.opacity = eio(ck);
  const q = eback(seg(t, 64.6, 65.2)), lg = eback(seg(t, 65.1, 65.9)), bt = eback(seg(t, 66.4, 67.0));
  $('ctaq').style.opacity = clamp01(q); $('ctaq').style.transform = `translateY(${(1-q)*50}px)`;
  $('ctalogo').style.opacity = clamp01(lg*1.2); $('ctalogo').style.transform = `scale(${0.85 + 0.15*lg})`;
  $('ctabtn').style.opacity = clamp01(bt); $('ctabtn').style.transform = `scale(${Math.max(0.01, bt)})`;

  captionAt(t); labelsAt(t); renderAll();
}
window.TOTAL_FRAMES = Math.round(DURATION * FPS);
window.renderFrame = f => { frame(f); return true; };
window.GPU = (() => { try { const g = document.createElement('canvas').getContext('webgl2'); const e = g.getExtension('WEBGL_debug_renderer_info'); return e ? g.getParameter(e.UNMASKED_RENDERER_WEBGL) : g.getParameter(g.RENDERER); } catch (e) { return 'desconocido'; } })();
document.fonts.ready.then(() => { window.READY = true; });
</script>
<script>
/* Lopia Studio: reproducción en vivo dentro del Studio (solo con ?studio) */
(()=>{const q=new URLSearchParams(location.search);if(!q.has('studio'))return;
let playing=true,t0=performance.now(),off=0,last=-1;const fps=+(q.get('fps')||15),step=Math.max(1,Math.round(30/fps));
const total=()=>window.TOTAL_FRAMES||450,cur=()=>playing?off+(performance.now()-t0)/1000:off;
function loop(){if(window.READY){const dur=total()/30;let t=cur();if(t>=dur){off=0;t0=performance.now();t=0;}
 const f=Math.min(total()-1,Math.floor(t*30/step)*step);if(f!==last){last=f;try{window.renderFrame(f);}catch(e){}}
 parent.postMessage({studio:1,t,dur,playing},'*');}requestAnimationFrame(loop);}
addEventListener('message',e=>{const d=e.data||{};
 if(d.cmd==='play'&&!playing){t0=performance.now();playing=true;}
 if(d.cmd==='pause'&&playing){off=cur();playing=false;}
 if(d.cmd==='seek'){off=Math.max(0,d.t);t0=performance.now();last=-1;}});
requestAnimationFrame(loop);})();
</script>
